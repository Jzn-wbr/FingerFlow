[project]
name = "fingerflow"
version = "0.1.0"
description = "Hand capture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.5.2",
    "mediapipe>=0.10.14",
    "opencv-python>=4.12.0.88",
    "pywin32>=311",
    "keyboard>=0.13.5",
]

[project.scripts]
fingerflow = "fingerflow.__main__:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fingerflow"]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]
